- id: turing-treatise
  autori: Alan M. Turing
  titolo: Treatise on the Enigma, capitolo 1
  editore: a cura di Ralph Erskine, Philip Marks e Frode Weierud
  url: https://cryptocellar.org/turing/turchap1.pdf
  note: Scritto a Bletchley Park durante la guerra; trascrizione del 1999 dall’esemplare dei National Archives statunitensi (NARA, RG 457). Le pagine sono quelle dell’originale, tra parentesi quadre nella trascrizione. Consultato il 3 novembre 2026; fonte delle citazioni d’apertura delle lezioni 1 e 3.
- id: kerckhoffs-1883
  autori: Auguste Kerckhoffs
  titolo: La cryptographie militaire
  editore: Journal des sciences militaires, vol. IX
  anno: 1883
  url: https://www.petitcolas.net/kerckhoffs/crypto_militaire_1.pdf
  note: Prima parte, gennaio 1883, pp. 5–38, nella riproduzione di Fabien Petitcolas. Consultato il 3 novembre 2026; fonte della citazione d’apertura della lezione 2 (p. 24) e del secondo requisito, il principio di Kerckhoffs, citato nella lezione 10 (p. 12).
- id: svetonio-divus-iulius
  autori: Svetonio
  titolo: De vita Caesarum, Divus Iulius
  url: https://www.thelatinlibrary.com/suetonius/suet.caesar.html
  note: Il cifrario di Cesare è descritto al capitolo 56. Testo latino consultato il 3 novembre 2026.
- id: singh-code-book-ragazzi
  autori: Simon Singh
  titolo: 'The Code Book: How to Make It, Break It, Hack It, Crack It'
  editore: Delacorte Press
  anno: 2003
  note: Edizione ridotta per ragazzi di «The Code Book» (1999), ISBN 9780385730624, consultata in epub il 3 novembre 2026; l’epub non ha numeri di pagina. Il capitolo 3, «The Mechanization of Secrecy», contiene il conto delle chiavi, circa 10 milioni di miliardi con tre rotori e sei cavi e senza contare gli anelli, e le catene di Rejewski, la cui lunghezza non dipende dal pannello.
