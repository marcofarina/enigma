# Bibliografia di base. L’id di ogni voce si usa nel frontmatter delle lezioni (campo `fonti`).
- id: singh-codici-segreti
  autori: Simon Singh
  titolo: Codici & segreti. La storia affascinante dei messaggi cifrati dall’antico Egitto a Internet
  editore: BUR Rizzoli
  anno: 2001
  note: Edizione italiana a cura di Stefano Galli; prima edizione Rizzoli 1999, edizione BUR Saggi dell’aprile 2001, ISBN 978-88-17-12539-0. Originale “The Code Book”, Fourth Estate, 1999. Consultata in epub il 4 novembre 2026; l’epub non ha numeri di pagina e si citano i capitoli.
- id: rejewski-1980
  autori: Marian Rejewski
  titolo: An Application of the Theory of Permutations in Breaking the Enigma Cipher
  editore: Applicationes Mathematicae 16 (4)
  anno: 1980
  url: https://cryptocellar.org/enigma/files/rew80.pdf
  note: Consultata la traduzione inglese pubblicata da CryptoCellar il 3 novembre 2026; le pagine sono quelle della trascrizione. Fonte delle citazioni d’apertura delle lezioni 6 (p. 3) e 9 (p. 1).
- id: welchman-hut-six
  autori: Gordon Welchman
  titolo: The Hut Six Story. Breaking the Enigma Codes
  editore: M&M Baldwin
  anno: 1998
  note: 'Seconda impressione, con correzioni minori, dell’edizione 1997, ISBN 0-947712-34-8; prima edizione McGraw-Hill 1982, con la parte 4 aggiunta nel 1986. Consultato il 4 novembre 2026 in una trascrizione senza pagine: si citano i capitoli.'
- id: kozaczuk-enigma
  autori: Władysław Kozaczuk
  titolo: Enigma. How the German Machine Cipher Was Broken, and How It Was Read by the Allies in World War Two
  editore: University Publications of America
  anno: 1984
  note: A cura di Christopher Kasparek, che lo ha tradotto dall’originale polacco “W kręgu Enigmy” (1979). Le appendici B–E sono testi di Marian Rejewski (pp. 229–291). Consultato il 4 novembre 2026; le pagine sono quelle stampate.
- id: sebag-montefiore-enigma
  autori: Hugh Sebag-Montefiore
  titolo: 'Enigma: The Battle for the Code'
  editore: Weidenfeld & Nicolson
  anno: 2000
  note: 'Consultato il 4 novembre 2026 nell’edizione digitale Hachette UK del 2011, senza pagine: si citano i capitoli.'
- id: batey-dilly
  autori: Mavis Batey
  titolo: 'Dilly: The Man Who Broke Enigmas'
  editore: Biteback Publishing (Dialogue)
  anno: 2009
  note: 'Consultato il 4 novembre 2026 nell’edizione del 2011, ISBN 978-1-84954-278-4, in epub senza pagine: si citano i capitoli.'
- id: bauer-decrypted-secrets
  autori: Friedrich L. Bauer
  titolo: Decrypted Secrets. Methods and Maxims of Cryptology
  editore: Springer, Berlin Heidelberg
  anno: 2007
  note: Quarta edizione, riveduta e ampliata, ISBN 978-3-540-24502-5. Consultata il 4 novembre 2026; le pagine sono quelle stampate.
- id: crypto-museum
  autori: Paul Reuvers, Marc Simons
  titolo: Crypto Museum — Enigma
  url: https://www.cryptomuseum.com/crypto/enigma/
- id: cryptocellar
  autori: Frode Weierud
  titolo: CryptoCellar — Enigma documents and rotor wiring catalog
  url: https://cryptocellar.org/enigma/
- id: summerside-enigma
  autori: Summerside Makerspace
  titolo: EnigmaMachine — browser based simulation of the cipher machine
  anno: 2016
  url: https://github.com/SummersideMakerspace/EnigmaMachine
  note: Simulatore da cui provengono i vettori di test usati per verificare il motore.
- id: hamer-1997
  autori: David H. Hamer
  titolo: Enigma. Actions Involved in the “Double Stepping” of the Middle Rotor
  editore: Cryptologia 21 (1)
  anno: 1997
  note: Citato da Crypto Museum come gennaio 1997, numero 1; il volume (21) è da verificare.
- id: us-6812-bombe-report
  autori: 6812th Signal Security Detachment, US Army
  titolo: Decoding German Enigma Machine Messages (The US 6812 Bombe Report)
  anno: 1944
  url: https://www.codesandciphers.org.uk/documents/bmbrpt/usbmbrpt.pdf
  note: Rapporto datato 1° ottobre 1944, trascritto da Tony Sale nel 2002. Descrive il foglio chiave, che si legge dal basso verso l’alto e si taglia giorno per giorno, e l’indicatore in due gruppi di tre lettere.
- id: luftwaffe-schluessel-619
  autori: Luftwaffe
  titolo: Luftwaffen-Maschinenschlüssel Nr. 619
  anno: 1944
  url: https://cryptocellar.org/enigma/e-keys/luftwaffen-mschluessel-nr619.pdf
  note: Foglio chiave originale, pubblicato da CryptoCellar. Modello delle schede stampabili. Anno da verificare.
