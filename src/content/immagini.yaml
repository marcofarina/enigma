  alt: Foglio stampato intitolato Heeres-Stabs-Maschinenschlüssel Süd Nr. 70, con una tabella che ha una riga per giorno e colonne di numeri romani, numeri a due cifre, coppie di lettere e gruppi di tre lettere.
  didascalia: Il foglio chiave Heeres-Stabs-Maschinenschlüssel Süd n. 70 dell’esercito tedesco, esposto al National Cryptologic Museum degli Stati Uniti. Ogni riga dà la chiave di un giorno — ordine dei rotori, anelli, collegamenti del pannello — e i gruppi di riconoscimento.
