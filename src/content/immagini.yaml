- id: rotori-con-anelli
  file: rotori-con-anelli.jpg
  titolo: Rotori con gli anelli delle lettere
  alt: Primo piano di tre rotori di Enigma montati nella macchina, con le lettere dell’alfabeto sugli anelli e le ruote dentate per girarli a mano.
  didascalia: Tre rotori al loro posto nella macchina. L’anello con le lettere si può far ruotare rispetto al cablaggio interno; la ruota dentata serve all’operatore per impostare la posizione.
