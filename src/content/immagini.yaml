- id: rotori-e-perno
  file: rotori-e-perno.jpg
  titolo: Due rotori e il perno
  alt: Due rotori di Enigma separati e il perno metallico su cui si infilano; su un lato si vedono i contatti a molla, sull’altro i contatti piatti, e sul bordo la tacca.
  didascalia: Due rotori smontati e il perno su cui si infilano. Su una faccia ci sono i contatti a molla, sull’altra quelli piatti; l’incavo sul bordo dell’anello è la tacca che fa avanzare il rotore vicino.
  categoria: componenti
